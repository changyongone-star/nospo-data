name: update-highlights
on:
  schedule:
    - cron: '7,37 * * * *' # 30분마다
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - name: commit
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "nospo-bot"
            git config user.email "nospo-bot@users.noreply.github.com"
            git add matches.json videos.json
            git commit -m "update highlights"
            git push
          fi
